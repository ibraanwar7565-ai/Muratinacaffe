<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1228" />

    <!-- Primary SEO -->
    <title>Aurelia — Experience Luxury Beyond Expectations | 5-Star Hotels & Resorts</title>
    <meta
      name="description"
      content="Aurelia is a world-class luxury hotel booking platform. Discover 5-star resorts, suites and private villas across the globe. Book exclusive stays with spa, fine dining and ocean views."
    />
    <meta name="keywords" content="luxury hotels, 5 star resorts, hotel booking, premium suites, spa resorts, fine dining, boutique hotels, villa rentals" />
    <meta name="author" content="Aurelia Hotels & Resorts" />
    <link rel="canonical" href="https://aurelia-hotels.example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aurelia — Experience Luxury Beyond Expectations" />
    <meta property="og:description" content="Discover and book the world's most exclusive 5-star resorts, suites and private villas." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1200&q=80" />
    <meta property="og:url" content="https://aurelia-hotels.example.com/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aurelia — Experience Luxury Beyond Expectations" />
    <meta name="twitter:description" content="Discover and book the world's most exclusive 5-star resorts and villas." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1200&q=80" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Hotel",
        "name": "Aurelia Hotels & Resorts",
        "description": "A collection of the world's finest 5-star luxury hotels and resorts.",
        "starRating": { "@type": "Rating", "ratingValue": "5" },
        "priceRange": "$$$$",
        "amenityFeature": [
          { "@type": "LocationFeatureSpecification", "name": "Spa" },
          { "@type": "LocationFeatureSpecification", "name": "Swimming Pool" },
          { "@type": "LocationFeatureSpecification", "name": "Fine Dining" },
          { "@type": "LocationFeatureSpecification", "name": "Free Wi-Fi" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
